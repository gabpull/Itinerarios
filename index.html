<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#243e66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Itinerario del viaje a Japón, octubre 2026. Línea de tiempo por día, con mapas.">
  <title>Japón · octubre 2026</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand-row">
        <p class="brand">Japón <span lang="ja">日本</span></p>
        <nav class="tabs" aria-label="Secciones">
          <button type="button" id="tab-day" class="tab is-on" aria-pressed="true">Días</button>
          <button type="button" id="tab-guide" class="tab" aria-pressed="false">Guía</button>
        </nav>
      </div>

      <div id="day-head">
        <button type="button" id="prev" class="day-nav">
          <span aria-hidden="true">↑</span> Día anterior
        </button>
        <div id="swipe-zone" class="date-block">
          <p id="weekday" class="weekday"></p>
          <h1 id="date-label"></h1>
          <p id="city-label" class="city"></p>
          <p id="who-label" class="who"></p>
        </div>
        <div id="strip" class="strip" role="tablist" aria-label="Días del viaje"></div>
        <div id="now" class="now" hidden></div>
      </div>
    </header>

    <main id="screen-day">
      <p id="summary" class="summary"></p>
      <div id="stay" class="stay"></div>
      <ul id="tips" class="tips"></ul>
      <ol id="timeline" class="timeline"></ol>
    </main>

    <main id="screen-guide" hidden></main>

    <button type="button" id="next" class="next-btn">
      Día siguiente <span aria-hidden="true">↓</span>
    </button>
  </div>

  <script src="js/itinerary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
